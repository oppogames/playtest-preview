<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oppo Games · Preview test</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6fc; color: #18243a; }
    main { box-sizing: border-box; width: min(100% - 32px, 420px); padding: 32px; border: 1px solid #dce4f2; border-radius: 20px; background: white; box-shadow: 0 12px 36px #17315d14; text-align: center; }
    .eyebrow { margin: 0 0 12px; color: #3159a4; font-size: .85rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 7vw, 2.3rem); }
    p { line-height: 1.5; }
    button { margin: 10px 0 18px; padding: 14px 24px; border: 0; border-radius: 12px; background: #3159a4; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover, button:focus-visible { background: #244684; }
    #count { margin: 0; font-size: 1.1rem; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Oppo Games · Preview test</p>
    <h1>Can you open and tap this?</h1>
    <p>This harmless page checks that a public preview loads and responds to a tap.</p>
    <button id="tap" type="button">Tap to test</button>
    <p id="count" aria-live="polite">Clicks: 0</p>
  </main>
  <script>
    let clicks = 0;
    document.getElementById('tap').addEventListener('click', () => {
      document.getElementById('count').textContent = `Clicks: ${++clicks}`;
    });
  </script>
</body>
</html>
